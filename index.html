        <section id="calendar-section">
            <nav class="calendar-header">
                <button id="prev">&lt;</button>
                <h3 id="week-month-year"></h3>
                <button id="next">&gt;</button>

                <button id="select-calendare-view">

                </button>
            </nav>

            <div class="days-weeks-months"></div>
        </section>

        <section id="targets-section">
            <nav id="target-nav">
                <h3 id="the-target"></h3>
            </nav>

            <div id="target-view"></div>
        </section>

        <section id="add-task-reminders">
            <h4>Add Task/Reminders</h4>
            <form id="task-form"></form>
                <section id="input-types">
                    <label id="input-type">
                        <input type="radio" name="type" value="target">
                        Target
                    </label>

                    <label id="input-type">
                        <input type="radio" name="type" value="task">
                        Task
                    </label>

                    <label id="input-type">
                        <input type="radio" name="type" value="reminder" >
                        Reminder
                    </label>
                </section>
            
                <section id="color-target-input">
                    <button class="color-option" id="red" style="background-color: #E57373">
                        <span class="color-tooltip">Red</span>
                    </button>

                    <button class="color-option" id="coral" style="background-color: #EF8A6A">
                        <span class="color-tooltip">Coral</span>
                    </button>

                    <button class="color-option" id="orange" style="background-color: #F2A65A">
                        <span class="color-tooltip">Orange</span>
                    </button>

                    <button class="color-option" id="green" style="background-color: #81C784">
                        <span class="color-tooltip">Green</span>
                    </button>

                    <button class="color-option" id="bluish-green" style="background-color: #4DB6AC">
                        <span class="color-tooltip">Bluish Green</span>
                    </button>

                    <button class="color-option" id="heavenly" style="background-color: #64C7D5">
                        <span class="color-tooltip">Heavenly</span>
                    </button>

                    <button class="color-option" id="blue" style="background-color: #64A3E3">
                        <span class="color-tooltip">Blue</span>
                    </button>

                    <button class="color-option" id="bluish-purple" style="background-color: #7986CB">
                        <span class="color-tooltip">Bluish Purple</span>
                    </button>

                    <button class="color-option" id="purple" style="background-color: #9575CD">
                        <span class="color-tooltip">Purple</span>
                    </button>

                    <button class="color-option" id="pink" style="background-color: #E889B5">
                        <span class="color-tooltip">Pink</span>
                    </button>

                    <button class="color-option" id="brown" style="background-color: #A9826D">
                        <span class="color-tooltip">Brown</span>
                    </button>

                    <button class="color-option" id="gray" style="background-color: #9E9E9E">
                        <span class="color-tooltip">Gray</span>
                    </button>
                </section>

                <label for="input-title">Title:</label>
                <input type="text" id="input-title" placeholder="Title..." required>

                <label for="input-details">Details:</label>
                <textarea id="input-details" placeholder="Details....."></textarea>

                <label for="selected-target">Target:</label>
                <select id="selected-target">
                    <option value="">Select Target</option>
                </select>

                <button type="submit" id="add-task-btn">Add</button>
            </form>
        </section>

        <section id="today-section">
            <nav id="today-nav">
                <h4>Today</h4>
                <button id="hide-today">
                    <span id="hide">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14.5 4L7 12L14.5 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="tooltip">Hide</span>

                    <span id="show">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9.5 4L17 12L9.5 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="tooltip">Show</span>
                </button>
            </nav>

            <section id="reminders-section"></section>

            <section id="tasks-section">
                  <div id="time"></div>

                  <div id="tasks"></div>
            </section>
        </section>

        <button id="notes-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-lightbulb" viewBox="0 0 16 16">

            <span class="tooltip">Notes</span>
        </button>

        <section id="notes-section">
            <nav id="min-notes-nav">
                <h4>Notes</h4>


            </nav>
            
        </section>
    </section>
